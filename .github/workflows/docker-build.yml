name: Build pyrunview

on:
  push:
    branches: [main]
    # 用 paths-ignore 而不是 paths：强制推送时 paths 过滤可能因空 diff 而不触发
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "example/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull
        run: docker pull "$IMAGE:latest"

      - name: 版本自检
        run: |
          docker run --rm --entrypoint bash "$IMAGE:latest" -c '
            set -e
            python3 --version
            google-chrome --version
            echo "--- X 服务器 ---"
            ls -l /usr/bin/Xkasmvnc /usr/bin/Xvnc 2>/dev/null || true
          '

      - name: 起桌面并验证 6901 可访问
        run: |
          set -e
          docker run -d --name smoke -p 6901:6901 "$IMAGE:latest" sleep 300
          ok=0
          for i in $(seq 1 40); do
            # -f 让 401/500 也判定失败：能通过就同时证明「不需要登录」
            if curl -fsS -o /dev/null http://127.0.0.1:6901/; then
              echo "6901 已就绪（第 ${i} 次尝试）"
              ok=1
              break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            # annotation 是这个工作流唯一能被外部读到的东西，诊断信息压成几行塞进去
            echo "::error::6901 无响应；容器内监听端口与 KasmVNC 日志见下"
            docker exec smoke bash -c '
              echo "== 监听端口 =="; (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true) | head -20
              echo "== X socket =="; ls -l /tmp/.X11-unix/ 2>/dev/null || echo none
              echo "== 进程 =="; ps aux | grep -iE "kasm|Xvnc" | grep -v grep || echo none
              echo "== kasmvnc.log =="; tail -n 30 /tmp/kasmvnc.log 2>/dev/null || echo none
              echo "== /usr/bin 里的 X 服务器 =="; ls -l /usr/bin/Xkasmvnc /usr/bin/Xvnc 2>/dev/null || echo none
              echo "== 容器内自检 6901 =="; curl -sS -m 3 -o /dev/null -w "%{http_code}\n" http://127.0.0.1:6901/ || echo curlfail
            ' 2>&1 | while IFS= read -r line; do echo "::error::$line"; done
            docker logs smoke 2>&1 | tail -n 20 | while IFS= read -r line; do echo "::error::docker| $line"; done
            exit 1
          fi
          echo "--- 状态码 ---"
          curl -sS -o /dev/null -w 'HTTP %{http_code}\n' http://127.0.0.1:6901/
          echo "--- 响应头 ---"
          curl -sS -D - -o /dev/null http://127.0.0.1:6901/ || true
          echo "--- 页面内容（前 20 行）---"
          curl -sS http://127.0.0.1:6901/ | head -20 || true

      - name: 确认桌面进程真的起来了
        run: |
          set -e
          docker exec smoke bash -c '
            echo "--- DISPLAY=$DISPLAY ---"
            ls -l /tmp/.X11-unix/ || true
            ps aux | grep -i kasm | grep -v grep || true
          '
          docker exec smoke bash -c 'test -S /tmp/.X11-unix/X99'
          echo "X socket 存在"
          # Chrome 必须能在这块虚拟屏上真的有头启动，否则「能看见画面」无从谈起
          docker exec smoke bash -c '
            google-chrome --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --headless=false --no-first-run --no-default-browser-check \
              --user-data-dir=/tmp/chrome-smoke about:blank >/tmp/chrome.log 2>&1 &
            sleep 8
            ps aux | grep -c "[c]hrome" || true
            tail -n 5 /tmp/chrome.log || true
          '
          docker exec smoke bash -c 'pgrep -f "[/]opt/google/chrome/chrome" >/dev/null'
          echo "Chrome 有头启动成功"

      - name: 画面通道必须免认证
        run: |
          set -e
          # 用镜像自带的 Chrome 真连一次 WebSocket：页面加载 200 只代表 HTTP 层通了，
          # 真正决定「能否看到桌面」的是 VNC 层的鉴权。少了 -SecurityTypes None 时，
          # 页面上会出现 "Authentication failure: No password configured for VNC Auth"。
          docker exec smoke bash -c '
            timeout 60 google-chrome --headless=new --no-sandbox --disable-gpu \
              --virtual-time-budget=15000 --dump-dom http://127.0.0.1:6901/ 2>/dev/null \
              > /tmp/dom.html || true
            if grep -qi "Authentication failure" /tmp/dom.html; then
              echo "::error::画面通道仍在鉴权：$(grep -oi "[^>]*Authentication failure[^<]*" /tmp/dom.html | head -2)"
              exit 1
            fi
            echo "DOM 中未出现鉴权失败"
          '

      - name: 桌面要有图标层和窗口管理器
        run: |
          set -e
          docker exec smoke bash -c '
            set -e
            test -x /root/Desktop/google-chrome.desktop
            echo "快捷方式存在"
            grep -q -- "--no-sandbox" /root/Desktop/google-chrome.desktop
            echo "快捷方式带 --no-sandbox（root 下必需）"
            command -v openbox
            command -v pcmanfm
            echo "--- 桌面进程 ---"
            ps -eo args | grep -E "[o]penbox|[p]cmanfm" || { echo "::error::桌面进程没起来"; exit 1; }
          '

      - name: 清理
        if: always()
        run: docker rm -f smoke || true
